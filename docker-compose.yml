name: talentgo
services:
  db:
    image: postgres:17
    command: ["postgres", "-p", "6543"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentgo}
      POSTGRES_USER: ${POSTGRES_USER:-talentgo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-6543}:6543"
    volumes:
      - talentgo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 6543"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  talentgo_pgdata:
